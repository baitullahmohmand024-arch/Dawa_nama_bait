<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BAIT ULLAH MIND TRICKS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #FFD700;
    --gold2: #FFA500;
    --green: #00FF88;
    --red: #FF3355;
    --bg: #0a0a1a;
    --card: rgba(255,255,255,0.05);
    --border: rgba(255,215,0,0.3);
  }

  body {
    background: var(--bg);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    color: #fff;
    touch-action: manipulation;
  }

  /* ── STARFIELD ── */
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* ── SCREENS ── */
  .screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
    transition: opacity .5s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* ══════════════════════════════
     TITLE TRANSITION
  ══════════════════════════════ */
  #titleScreen { background: radial-gradient(ellipse at center, #0d0d2b 0%, #000 100%); }

  .title-wrap {
    text-align: center;
    animation: fadeInDown .8s ease both;
  }

  .title-bait {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem, 9vw, 4.5rem);
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #FFD700, #FF8C00, #FFD700, #FFF700, #FFD700);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 2.5s linear infinite, fadeInDown .8s ease both;
    text-shadow: none;
    filter: drop-shadow(0 0 18px rgba(255,215,0,0.8)) drop-shadow(0 0 40px rgba(255,140,0,0.5));
    line-height: 1.1;
  }

  .title-mind {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.1rem, 5vw, 2.5rem);
    font-weight: 700;
    letter-spacing: 10px;
    color: #fff;
    text-shadow: 0 0 15px rgba(255,255,255,0.6), 0 0 30px rgba(100,200,255,0.4);
    animation: pulseGlow 2s ease-in-out infinite, fadeInUp .8s ease .3s both;
    margin-top: 8px;
  }

  .title-tricks {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.6rem, 7vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #FF6B6B, #FF0055, #FF6B6B);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 14px rgba(255,0,85,0.9));
    animation: flicker 3s ease-in-out infinite, fadeInUp .8s ease .6s both;
  }

  .subtitle {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(0.8rem, 3.5vw, 1.1rem);
    letter-spacing: 4px;
    color: rgba(255,215,0,0.7);
    margin-top: 6px;
    text-transform: uppercase;
    animation: fadeInUp .8s ease .9s both;
  }

  .divider {
    width: 200px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 24px auto;
    animation: fadeIn 1s ease 1s both;
  }

  .game-title-small {
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.75rem, 3vw, 1rem);
    letter-spacing: 3px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    animation: fadeIn 1s ease 1.2s both;
  }

  /* ── START BUTTON ── */
  .btn-start {
    margin-top: 36px;
    padding: 16px 48px;
    font-family: 'Orbitron', monospace;
    font-size: clamp(1rem, 4vw, 1.3rem);
    font-weight: 700;
    letter-spacing: 4px;
    color: #000;
    background: linear-gradient(135deg, #FFD700, #FF8C00);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 60px rgba(255,140,0,0.3);
    transition: transform .15s, box-shadow .15s;
    animation: fadeInUp .8s ease 1.4s both, btnPulse 2s ease-in-out 2.2s infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-start:active { transform: scale(0.95); }

  /* ══════════════════════════════
     GAME SCREEN
  ══════════════════════════════ */
  #gameScreen {
    background: radial-gradient(ellipse at top, #0d1533 0%, #050510 100%);
    padding: 0;
    justify-content: flex-start;
    overflow-y: auto;
  }

  .game-header {
    width: 100%; max-width: 480px;
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 20;
  }

  .header-brand {
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.6rem, 2.5vw, 0.8rem);
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #FFD700, #FF8C00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .timer-box {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 16px;
  }
  .timer-icon { font-size: 1.1rem; }
  #timerDisplay {
    font-family: 'Orbitron', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--gold);
    min-width: 36px;
    text-align: center;
    transition: color .3s;
  }
  #timerDisplay.danger { color: var(--red); animation: timerDanger .5s ease-in-out infinite; }

  .next-label {
    font-size: clamp(0.65rem, 2.5vw, 0.8rem);
    color: rgba(255,255,255,0.5);
    letter-spacing: 1px;
    text-align: right;
  }
  .next-num {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1rem, 4vw, 1.4rem);
    font-weight: 700;
    color: #00BFFF;
    text-shadow: 0 0 12px rgba(0,191,255,0.8);
  }

  .game-body {
    width: 100%; max-width: 480px;
    padding: 16px;
    flex: 1;
  }

  .instructions {
    text-align: center;
    font-size: clamp(0.75rem, 3vw, 0.9rem);
    color: rgba(255,255,255,0.45);
    letter-spacing: 1px;
    margin-bottom: 16px;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .cell {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.85rem, 3.5vw, 1.1rem);
    font-weight: 700;
    cursor: pointer;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.85);
    transition: transform .1s, background .2s, border-color .2s, box-shadow .2s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    position: relative;
    overflow: hidden;
  }
  .cell::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
    border-radius: inherit;
  }
  .cell:active { transform: scale(0.92); }

  .cell.correct {
    background: rgba(0,255,136,0.25);
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 16px rgba(0,255,136,0.5), inset 0 0 10px rgba(0,255,136,0.1);
    pointer-events: none;
  }
  .cell.wrong {
    background: rgba(255,51,85,0.3);
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 16px rgba(255,51,85,0.6);
    animation: shake .4s ease;
  }

  /* ══════════════════════════════
     OVERLAYS
  ══════════════════════════════ */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 30px;
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
  }
  .overlay.show { opacity: 1; pointer-events: all; }

  /* LOSE */
  #loseOverlay {
    background: radial-gradient(ellipse at center, rgba(100,0,20,0.97) 0%, rgba(20,0,5,0.99) 100%);
  }
  .lose-icon { font-size: 5rem; animation: bounceIn .6s ease both; }
  .lose-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.8rem, 8vw, 3.5rem);
    font-weight: 900;
    color: var(--red);
    text-shadow: 0 0 30px rgba(255,51,85,0.8), 0 0 60px rgba(255,0,55,0.4);
    letter-spacing: 4px;
    animation: bounceIn .6s ease .2s both;
    line-height: 1.2;
  }
  .lose-sub {
    font-size: clamp(0.9rem, 4vw, 1.2rem);
    color: rgba(255,150,150,0.8);
    letter-spacing: 3px;
    margin-top: 8px;
    animation: fadeIn .8s ease .5s both;
  }

  /* WIN */
  #winOverlay {
    background: radial-gradient(ellipse at center, rgba(0,60,20,0.97) 0%, rgba(0,10,5,0.99) 100%);
  }
  .win-icon { font-size: 5rem; animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both; }
  .win-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.5rem, 7vw, 3rem);
    font-weight: 900;
    background: linear-gradient(90deg, #FFD700, #00FF88, #FFD700);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 1.5s linear infinite, bounceIn .6s ease .2s both;
    letter-spacing: 3px;
    line-height: 1.2;
  }
  .win-sub {
    font-size: clamp(0.9rem, 4vw, 1.2rem);
    color: rgba(150,255,200,0.8);
    letter-spacing: 2px;
    margin-top: 8px;
    animation: fadeIn .8s ease .5s both;
  }
  .win-score {
    margin-top: 20px;
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.8rem, 3.5vw, 1rem);
    color: var(--gold);
    letter-spacing: 2px;
    animation: fadeIn .8s ease .7s both;
  }

  .btn-retry {
    margin-top: 32px;
    padding: 14px 40px;
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.85rem, 3.5vw, 1rem);
    font-weight: 700;
    letter-spacing: 3px;
    color: #000;
    background: linear-gradient(135deg, #FFD700, #FF8C00);
    border: none; border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255,215,0,0.5);
    animation: fadeInUp .8s ease .9s both;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s;
  }
  .btn-retry:active { transform: scale(0.95); }

  /* ══════════════════════════════
     CONFETTI CANVAS
  ══════════════════════════════ */
  #confettiCanvas {
    position: fixed; inset: 0; z-index: 99;
    pointer-events: none;
  }

  /* ══════════════════════════════
     KEYFRAMES
  ══════════════════════════════ */
  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  @keyframes pulseGlow {
    0%,100% { text-shadow: 0 0 15px rgba(255,255,255,0.6), 0 0 30px rgba(100,200,255,0.4); }
    50%      { text-shadow: 0 0 25px rgba(255,255,255,0.9), 0 0 50px rgba(100,200,255,0.7); }
  }
  @keyframes flicker {
    0%,95%,100% { opacity: 1; }
    96%,98%     { opacity: 0.6; }
    97%,99%     { opacity: 1; }
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 60px rgba(255,140,0,0.3); }
    50%     { box-shadow: 0 0 45px rgba(255,215,0,0.9), 0 0 90px rgba(255,140,0,0.5); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-5px); }
    80%     { transform: translateX(5px); }
  }
  @keyframes bounceIn {
    0%   { opacity: 0; transform: scale(0.3); }
    50%  { transform: scale(1.1); }
    80%  { transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0) rotate(-20deg); }
    70%  { transform: scale(1.2) rotate(5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes timerDanger {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.15); }
  }
</style>
</head>
<body>

<!-- STAR CANVAS -->
<canvas id="stars"></canvas>
<!-- CONFETTI CANVAS -->
<canvas id="confettiCanvas"></canvas>

<!-- ══ TITLE SCREEN ══ -->
<div class="screen" id="titleScreen">
  <div class="title-wrap">
    <div class="title-bait">BAIT ULLAH</div>
    <div class="title-mind">MIND</div>
    <div class="title-tricks">TRICKS</div>
    <div class="subtitle">✦ Challenge Your Brain ✦</div>
  </div>
  <div class="divider"></div>
  <div class="game-title-small">presents</div>
  <div style="font-family:'Orbitron',monospace;font-size:clamp(0.8rem,3.5vw,1.1rem);letter-spacing:3px;color:rgba(0,191,255,0.8);margin-top:8px;animation:fadeIn 1s ease 1.3s both;">
    MIND TRICK: NUMBER ORDER
  </div>
  <button class="btn-start" onclick="startGame()">▶ START GAME</button>
</div>

<!-- ══ GAME SCREEN ══ -->
<div class="screen hidden" id="gameScreen" style="align-items:center;">
  <div class="game-header">
    <div class="header-brand">BAIT ULLAH<br>MIND TRICKS</div>
    <div class="timer-box">
      <span class="timer-icon">⏱</span>
      <span id="timerDisplay">30</span>
    </div>
    <div style="text-align:right;">
      <div class="next-label">NEXT</div>
      <div class="next-num" id="nextNum">1</div>
    </div>
  </div>
  <div class="game-body">
    <div class="instructions">Tap numbers 1 → 30 in order before time runs out!</div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- ══ LOSE OVERLAY ══ -->
<div class="overlay" id="loseOverlay">
  <div class="lose-icon">💀</div>
  <div class="lose-title">SORRY<br>YOU LOSE</div>
  <div class="lose-sub">TIME'S UP!</div>
  <div id="loseScore" style="margin-top:16px;font-family:'Orbitron',monospace;font-size:0.9rem;color:rgba(255,150,150,0.7);letter-spacing:2px;"></div>
  <button class="btn-retry" onclick="resetGame()">↺ TRY AGAIN</button>
</div>

<!-- ══ WIN OVERLAY ══ -->
<div class="overlay" id="winOverlay">
  <div class="win-icon">🏆</div>
  <div class="win-title">CONGRAT-<br>ULATIONS!</div>
  <div class="win-sub">YOU DID IT! 🎉</div>
  <div class="win-score" id="winScore"></div>
  <button class="btn-retry" onclick="resetGame()">↺ PLAY AGAIN</button>
</div>

<script>
/* ════════════════════════════════
   STARFIELD
════════════════════════════════ */
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize(){ c.width=innerWidth; c.height=innerHeight; init(); }
  function init(){
    stars=[];
    for(let i=0;i<160;i++) stars.push({
      x: Math.random()*c.width, y: Math.random()*c.height,
      r: Math.random()*1.4+.2, a: Math.random(), da: (Math.random()-.5)*.012
    });
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      s.a = Math.max(0,Math.min(1,s.a+s.da));
      if(s.a<=0||s.a>=1) s.da*=-1;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize(); draw();
})();

/* ════════════════════════════════
   CONFETTI ENGINE
════════════════════════════════ */
const confCanvas = document.getElementById('confettiCanvas');
const confCtx = confCanvas.getContext('2d');
let confPieces = [], confRunning = false;

function resizeConf(){ confCanvas.width=innerWidth; confCanvas.height=innerHeight; }
window.addEventListener('resize', resizeConf); resizeConf();

const COLORS = ['#FFD700','#FF6B6B','#00FF88','#00BFFF','#FF69B4','#FFA500','#ADFF2F','#EE82EE'];
const SHAPES = ['circle','rect','petal'];

function launchConfetti(){
  confPieces=[];
  for(let i=0;i<180;i++){
    confPieces.push({
      x: Math.random()*confCanvas.width,
      y: -20 - Math.random()*200,
      vx: (Math.random()-0.5)*5,
      vy: Math.random()*4+2,
      r: Math.random()*8+4,
      color: COLORS[Math.floor(Math.random()*COLORS.length)],
      shape: SHAPES[Math.floor(Math.random()*SHAPES.length)],
      rot: Math.random()*Math.PI*2,
      drot: (Math.random()-0.5)*.15,
      alpha: 1
    });
  }
  confRunning=true;
  animConf();
}

function animConf(){
  if(!confRunning) return;
  confCtx.clearRect(0,0,confCanvas.width,confCanvas.height);
  let alive=false;
  confPieces.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.rot+=p.drot;
    if(p.y > confCanvas.height+20) { p.alpha-=0.05; }
    if(p.alpha<=0) return;
    alive=true;
    confCtx.save();
    confCtx.globalAlpha=p.alpha;
    confCtx.translate(p.x,p.y);
    confCtx.rotate(p.rot);
    confCtx.fillStyle=p.color;
    if(p.shape==='circle'){
      confCtx.beginPath(); confCtx.arc(0,0,p.r,0,Math.PI*2); confCtx.fill();
    } else if(p.shape==='rect'){
      confCtx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.5);
    } else { // petal
      confCtx.beginPath();
      confCtx.ellipse(0,-p.r,p.r*0.4,p.r,0,0,Math.PI*2);
      confCtx.fill();
    }
    confCtx.restore();
  });
  if(alive) requestAnimationFrame(animConf);
  else { confRunning=false; confCtx.clearRect(0,0,confCanvas.width,confCanvas.height); }
}

/* ════════════════════════════════
   GAME LOGIC
════════════════════════════════ */
let numbers=[], nextExpected=1, timerVal=30, timerInterval=null, startTime=0;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function startGame(){
  document.getElementById('titleScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  initGame();
}

function initGame(){
  numbers = shuffle([...Array(30).keys()].map(i=>i+1));
  nextExpected = 1;
  startTime = Date.now();
  buildGrid();
  updateNextDisplay();
  startTimer();
}

function buildGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  numbers.forEach(n=>{
    const cell = document.createElement('div');
    cell.className='cell';
    cell.textContent=n;
    cell.dataset.num=n;
    cell.addEventListener('click', ()=>handleTap(cell, n));
    grid.appendChild(cell);
  });
}

function handleTap(cell, n){
  if(cell.classList.contains('correct')) return;
  if(n === nextExpected){
    cell.classList.add('correct');
    nextExpected++;
    updateNextDisplay();
    if(nextExpected > 30) { setTimeout(winGame, 200); }
  } else {
    cell.classList.add('wrong');
    setTimeout(()=>cell.classList.remove('wrong'), 420);
  }
}

function updateNextDisplay(){
  document.getElementById('nextNum').textContent = nextExpected <= 30 ? nextExpected : '✓';
}

function startTimer(){
  clearInterval(timerInterval);
  timerVal = 30;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timerVal--;
    updateTimerDisplay();
    if(timerVal<=0){ clearInterval(timerInterval); loseGame(); }
  },1000);
}

function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  el.textContent = timerVal;
  if(timerVal<=10) el.classList.add('danger');
  else el.classList.remove('danger');
}

function loseGame(){
  const reached = nextExpected - 1;
  document.getElementById('loseScore').textContent = `You reached: ${reached} / 30`;
  document.getElementById('loseOverlay').classList.add('show');
}

function winGame(){
  clearInterval(timerInterval);
  const elapsed = ((Date.now()-startTime)/1000).toFixed(1);
  const timeUsed = 30 - timerVal;
  document.getElementById('winScore').textContent = `Completed in ${elapsed}s • Time used: ${timeUsed}s`;
  document.getElementById('winOverlay').classList.add('show');
  launchConfetti();
}

function resetGame(){
  document.getElementById('loseOverlay').classList.remove('show');
  document.getElementById('winOverlay').classList.remove('show');
  confRunning = false;
  confCtx.clearRect(0,0,confCanvas.width,confCanvas.height);
  initGame();
}
</script>
